services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rss_user
      POSTGRES_PASSWORD: rss_password
      POSTGRES_DB: rss_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rss_user -d rss_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./api     
      target: builder # FIXED: Changed from deps to builder so prisma.config.js is included
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rss_user:rss_password@db:5432/rss_db   
    entrypoint: ["sh", "-c", "npx prisma migrate deploy"]

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://rss_user:rss_password@db:5432/rss_db
      NODE_ENV: production
      FRONTEND_ORIGIN: http://3.81.143.236
    ports:
      - "4080:4000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://3.81.143.236:4080
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:3000"

volumes:
  db_data:
